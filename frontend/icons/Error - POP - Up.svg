<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Background card drop shadow -->
    <filter id="card-shadow" x="-10%" y="-8%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1b14" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1b14" flood-opacity="0.04" />
    </filter>

    <!-- Button drop shadow -->
    <filter id="btn-shadow" x="-20%" y="-20%" width="140%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#e93f33" flood-opacity="0.32" />
    </filter>

    <!-- Clip path to keep header shape perfectly inside rounded card -->
    <clipPath id="card-clip">
      <rect x="25" y="20" width="350" height="440" rx="36" ry="36" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-size: 22px;
      font-weight: 700;
      fill: #1a1a1a;
      text-anchor: middle;
    }
    .body-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
      fill: #555555;
      text-anchor: middle;
    }
    .btn-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Card Background with Shadow -->
  <rect x="25" y="20" width="350" height="440" rx="36" ry="36" fill="#ffffff" filter="url(#card-shadow)" />

  <!-- Top Header Section (clipped to card's rounded top corners) -->
  <g clip-path="url(#card-clip)">
    <!-- Red Header Banner with curved bottom -->
    <path d="M 25,20 
             L 375,20 
             L 375,205 
             C 275,240 125,240 25,205 
             Z" 
          fill="#eb3f33" />

    <!-- Rounded Warning Triangle Icon -->
    <path d="M 200,64 
             C 211,64 220,70 226,80 
             L 257,134 
             C 263,144 263,156 257,166 
             C 251,176 241,182 229,182 
             L 171,182 
             C 159,182 149,176 143,166 
             C 137,156 137,144 143,134 
             L 174,80 
             C 180,70 189,64 200,64 Z" 
          fill="#ffffff" />

    <!-- Exclamation Mark Inside Triangle -->
    <!-- Exclamation Bar -->
    <path d="M 200,96 
             C 204,96 207,99 206.6,104 
             L 204.2,135 
             C 203.9,138.5 201.2,141 198,141 
             C 194.8,141 192.1,138.5 191.8,135 
             L 189.4,104 
             C 189,99 192,96 196,96 
             Z" 
          fill="#eb3f33" />

    <!-- Exclamation Dot -->
    <circle cx="198" cy="153" r="4.8" fill="#eb3f33" />
  </g>

  <!-- Title -->
  <text x="200" y="278" class="title">Error Message!</text>

  <!-- Description / Lorem Ipsum Body -->
  <text class="body-text">
    <tspan x="200" y="304">Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed</tspan>
    <tspan x="200" y="321">diam nonummy nibh euismod tincidunt ut laoreet dolore magna</tspan>
    <tspan x="200" y="338">aliquam erat volutpat wisi enim ad minim veniam duis</tspan>
    <tspan x="200" y="355">autem vel eum iriure dolor.</tspan>
  </text>

  <!-- Call-to-Action Button with Glow Shadow -->
  <rect x="75" y="390" width="250" height="48" rx="24" ry="24" fill="#eb3f33" filter="url(#btn-shadow)" />
  <text x="200" y="420" class="btn-text">Learn More</text>
</svg>
