<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus &bull; Work List</title>
  <link rel="icon" type="image/png" href="assets/images/image.png">
  <link rel="stylesheet" href="assets/css/home.css?v=26">
</head>

<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">

      <!-- Left Side: Company Logo -->
      <a href="home.html" class="nav-brand">
        <img src="assets/images/image.png" alt="Nexus Logo" class="nav-logo-img">
      </a>

      <!-- Right Side: Navigation Icons (40px size with tooltips) -->
      <div class="nav-icons-group">

        <!-- 1. Master Icon -->
        <button type="button" class="nav-icon-item" data-tooltip="Master" aria-label="Master">
          <img src="icons/Master.svg" alt="Master" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 2. Projects (Home) Icon -->
        <button type="button" class="nav-icon-item" data-tooltip="Projects" aria-label="Projects">
          <img src="icons/Home.svg" alt="Projects" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 3. Accounts Icon -->
        <button type="button" class="nav-icon-item" data-tooltip="Accounts" aria-label="Accounts">
          <img src="icons/Accounts.svg" alt="Accounts" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 4. Admin Icon -->
        <button type="button" class="nav-icon-item" data-tooltip="Admin" aria-label="Admin">
          <img src="icons/Admin.svg" alt="Admin" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 5. Worklist (Alert Bell) Icon -->
        <button type="button" class="nav-icon-item active-nav-tab" data-tooltip="Worklist" aria-label="Worklist">
          <img src="icons/Worklist.svg" alt="Worklist" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 6. Purchase (BOQ) Icon -->
        <button type="button" class="nav-icon-item" data-tooltip="Purchase" aria-label="Purchase">
          <img src="icons/BOQ.svg" alt="Purchase" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 7. Inventory Icon -->
        <button type="button" class="nav-icon-item" data-tooltip="Inventory" aria-label="Inventory">
          <img src="icons/Inventry.svg" alt="Inventory" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 8. Profile Icon -->
        <button type="button" class="nav-icon-item" data-tooltip="Profile" aria-label="Profile">
          <img src="icons/Profile.svg" alt="Profile" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 9. Sign Out Icon (Power Icon - Turns RED on hover) -->
        <a href="index.html" class="nav-icon-item nav-power-btn" data-tooltip="Sign Out" aria-label="Sign Out" id="btnPowerOff">
          <svg class="nav-power-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
            <line x1="12" y1="2" x2="12" y2="12" />
          </svg>
        </a>

      </div>

    </div>
  </nav>

  <!-- Green Title Sub-Header Banner (Work List) -->
  <header class="worklist-banner">
    <div class="worklist-banner-inner">
      <h1 class="worklist-banner-title">Work List</h1>
    </div>
  </header>

  <!-- Main Work List Workspace Container (Full Page Width) -->
  <main class="worklist-main-full">

    <!-- Action Toolbar (Dynamically updated for PO & Payment views) -->
    <div class="worklist-toolbar" id="worklistToolbar">
      <!-- Injected by home.js based on PO or Payment view -->
    </div>

    <!-- Full-Width Work List Data Table Container -->
    <div class="table-container-full">
      <table class="worklist-table-full" id="worklistTable">
        <thead id="worklistTableHead">
          <!-- Injected dynamically by home.js based on PO or Payment view -->
        </thead>
        <tbody id="worklistTableBody">
          <!-- Injected dynamically by home.js based on PO or Payment view -->
        </tbody>
      </table>
    </div>

    <!-- Bottom View Switcher Toggles (Payment & PO closely joined with 1px divider) -->
    <div class="worklist-footer-bar">
      <div class="segmented-toggle-group">
        <!-- Payment Toggle Button -->
        <button type="button" class="segmented-btn" id="btnTogglePayment" data-view="payment">
          Payment
        </button>
        <!-- 1px Separator Line -->
        <div class="segmented-divider"></div>
        <!-- PO Toggle Button -->
        <button type="button" class="segmented-btn active" id="btnTogglePO" data-view="po">
          PO
        </button>
      </div>
    </div>

  </main>

  <!-- EXCEL-STYLE FILTER POPUP (Dynamic dropdown attached to column header) -->
  <div class="excel-filter-dropdown" id="excelFilterDropdown" style="display: none;">
    <!-- Filter Header -->
    <div class="excel-filter-header">
      <span class="excel-filter-col-title" id="filterColTitle">Filter Column</span>
      <button type="button" class="excel-filter-close-btn" id="btnFilterClose">&times;</button>
    </div>

    <!-- Sort Quick Options -->
    <div class="excel-filter-sort-group">
      <button type="button" class="excel-sort-btn" id="btnSortAsc">
        <span class="sort-icon">&uarr;</span> Sort Ascending (A &rarr; Z)
      </button>
      <button type="button" class="excel-sort-btn" id="btnSortDesc">
        <span class="sort-icon">&darr;</span> Sort Descending (Z &rarr; A)
      </button>
      <button type="button" class="excel-clear-col-btn" id="btnClearColFilter">
        Clear Filter From This Column
      </button>
    </div>

    <div class="excel-filter-divider"></div>

    <!-- Live Search Bar -->
    <div class="excel-filter-search-wrap">
      <span class="search-lens">&#128269;</span>
      <input type="text" class="excel-filter-search-input" id="filterSearchInput" placeholder="Search values...">
    </div>

    <!-- Checkbox Options List Container -->
    <div class="excel-filter-options-box">
      <!-- Select All Checkbox -->
      <label class="excel-checkbox-item select-all-item">
        <input type="checkbox" id="chkFilterSelectAll" checked>
        <span class="chk-label"><strong>(Select All)</strong></span>
      </label>

      <!-- Scrollable Distinct Values Checkbox List -->
      <div class="excel-checkbox-scroll-list" id="filterCheckboxList">
        <!-- Injected dynamically by home.js -->
      </div>
    </div>

    <!-- Footer Action Buttons -->
    <div class="excel-filter-footer">
      <button type="button" class="btn-excel-apply" id="btnApplyFilter">Apply Filter</button>
      <button type="button" class="btn-excel-cancel" id="btnCancelFilter">Cancel</button>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="home-toast" id="homeToast"></div>

  <script src="assets/js/home.js?v=26"></script>
</body>

</html>
