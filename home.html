<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus &bull; Ecosystem</title>
  <link rel="icon" type="image/png" href="assets/images/image.png">
  <link rel="stylesheet" href="assets/css/home.css?v=30">
</head>

<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">

      <!-- Left Side: Company Logo -->
      <a href="home.html" class="nav-brand">
        <img src="assets/images/image.png" alt="Nexus Logo" class="nav-logo-img">
      </a>

      <!-- Right Side: 9 Navigation Icons (40px size with tooltips) -->
      <div class="nav-icons-group">

        <!-- 1. Master Icon -->
        <button type="button" class="nav-icon-item" id="navBtnMaster" data-module="master" data-tooltip="Master" aria-label="Master">
          <img src="icons/Master.svg" alt="Master" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 2. Projects (Home) Icon -->
        <button type="button" class="nav-icon-item" id="navBtnProjects" data-module="projects" data-tooltip="Projects" aria-label="Projects">
          <img src="icons/Home.svg" alt="Projects" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 3. Accounts Icon -->
        <button type="button" class="nav-icon-item" id="navBtnAccounts" data-module="accounts" data-tooltip="Accounts" aria-label="Accounts">
          <img src="icons/Accounts.svg" alt="Accounts" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 4. Admin Icon -->
        <button type="button" class="nav-icon-item" id="navBtnAdmin" data-module="admin" data-tooltip="Admin" aria-label="Admin">
          <img src="icons/Admin.svg" alt="Admin" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 5. Worklist (Alert Bell) Icon -->
        <button type="button" class="nav-icon-item active-nav-tab" id="navBtnWorklist" data-module="worklist" data-tooltip="Worklist" aria-label="Worklist">
          <img src="icons/Worklist.svg" alt="Worklist" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 6. Purchase (Cart) Icon -->
        <button type="button" class="nav-icon-item" id="navBtnPurchase" data-module="purchase" data-tooltip="Purchase" aria-label="Purchase">
          <img src="icons/Purchase.svg" alt="Purchase" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 7. Inventory Icon -->
        <button type="button" class="nav-icon-item" id="navBtnInventory" data-module="inventory" data-tooltip="Inventory" aria-label="Inventory">
          <img src="icons/Inventry.svg" alt="Inventory" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 8. Profile Icon -->
        <button type="button" class="nav-icon-item" id="navBtnProfile" data-module="profile" data-tooltip="Profile" aria-label="Profile">
          <img src="icons/Profile.svg" alt="Profile" class="nav-icon-img" width="40" height="40">
        </button>

        <!-- 9. Sign Out Icon (Power Icon - Turns RED on hover) -->
        <a href="index.html" class="nav-icon-item nav-power-btn" data-tooltip="Sign Out" aria-label="Sign Out" id="btnPowerOff">
          <svg class="nav-power-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
            <line x1="12" y1="2" x2="12" y2="12" />
          </svg>
        </a>

      </div>

    </div>
  </nav>

  <!-- Green Title Sub-Header Banner (Work List / Company Name) -->
  <header class="worklist-banner">
    <div class="worklist-banner-inner">
      <h1 class="worklist-banner-title" id="pageBannerTitle">Work List</h1>
    </div>
  </header>

  <!-- Main Workspace Container (Full Page Width) -->
  <main class="worklist-main-full">

    <!-- Action Toolbar (Dynamically rendered based on active module & sub-page) -->
    <div class="worklist-toolbar" id="worklistToolbar">
      <!-- Injected dynamically by home.js -->
    </div>

    <!-- Full-Width Data Table Container -->
    <div class="table-container-full">
      <table class="worklist-table-full" id="worklistTable">
        <thead id="worklistTableHead">
          <!-- Injected dynamically by home.js -->
        </thead>
        <tbody id="worklistTableBody">
          <!-- Injected dynamically by home.js -->
        </tbody>
      </table>
    </div>

    <!-- Bottom View Switcher Toggles (In Left Below Corner) -->
    <div class="worklist-footer-bar" id="worklistFooterBar">
      <!-- Injected dynamically by home.js based on Master vs Worklist -->
    </div>

  </main>

  <!-- ADD CUSTOMER / ADD RECORD SIDE POPUP CARD (Small message-like on left side) -->
  <div class="side-form-overlay" id="sideFormOverlay" style="display: none;">
    <div class="side-form-container">
      
      <!-- Main Form Card -->
      <div class="side-form-card" id="addCustomerCard">
        <!-- Header -->
        <div class="side-form-header">
          <div class="side-form-title-badge">Add Customer</div>
          <button type="button" class="side-form-close-btn" id="btnCloseSideForm" aria-label="Close form">&times;</button>
        </div>

        <!-- Decorative Action Icons on Top Right of Card -->
        <div class="side-form-top-icons">
          <!-- Mail with Phone -->
          <button type="button" class="card-action-icon-btn" title="Contact & Mail">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </button>
          <!-- Location Pin -->
          <button type="button" class="card-action-icon-btn" title="Location Pin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </button>
          <!-- Edit Pencil -->
          <button type="button" class="card-action-icon-btn" title="Edit Info">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </button>
        </div>

        <!-- Form Rows Grid -->
        <form class="side-form-body" id="frmAddCustomer" onsubmit="event.preventDefault();">
          
          <!-- 1. Business Type -->
          <div class="form-row-group">
            <label class="form-label" for="inpBusinessType">Business Type</label>
            <div class="form-input-wrap">
              <select class="form-select-control" id="inpBusinessType">
                <option value="Indus">Indus</option>
                <option value="Infra">Infra</option>
                <option value="Supply">Supply</option>
                <option value="Audit">Audit</option>
              </select>
            </div>
          </div>

          <!-- 2. Customer ID -->
          <div class="form-row-group">
            <label class="form-label" for="inpCustomerId">Customer ID</label>
            <div class="form-input-wrap">
              <input type="text" class="form-input-control" id="inpCustomerId" value="230510679" placeholder="Enter Customer ID">
            </div>
          </div>

          <!-- 3. Customer Name -->
          <div class="form-row-group">
            <label class="form-label" for="inpCustomerName">Customer Name</label>
            <div class="form-input-wrap">
              <input type="text" class="form-input-control" id="inpCustomerName" placeholder="Enter Customer Name">
            </div>
          </div>

          <!-- 4. GST Type -->
          <div class="form-row-group">
            <label class="form-label" for="inpGstType">GST Type</label>
            <div class="form-input-wrap">
              <select class="form-select-control" id="inpGstType">
                <option value="SGST">SGST</option>
                <option value="IGST">IGST</option>
                <option value="NA">NA</option>
              </select>
            </div>
          </div>

          <!-- 5. GST Number with PDF badge -->
          <div class="form-row-group">
            <label class="form-label" for="inpGstNumber">GST Number</label>
            <div class="form-input-wrap with-action-badge">
              <input type="text" class="form-input-control form-input-highlight" id="inpGstNumber" value="33ASMPM8643F">
              <span class="input-pdf-badge" title="Upload/View PDF">
                <span class="pdf-up-arrow">&uarr;</span>
                <span class="pdf-tag">PDF</span>
              </span>
            </div>
          </div>

          <!-- 6. PAN Number with PDF badge -->
          <div class="form-row-group">
            <label class="form-label" for="inpPanNumber">PAN Number</label>
            <div class="form-input-wrap with-action-badge">
              <input type="text" class="form-input-control form-input-highlight" id="inpPanNumber" value="33ASMPM8643F">
              <span class="input-pdf-badge" title="Upload/View PDF">
                <span class="pdf-up-arrow">&uarr;</span>
                <span class="pdf-tag">PDF</span>
              </span>
            </div>
          </div>

          <!-- 7. Invoice Type -->
          <div class="form-row-group">
            <label class="form-label" for="inpInvoiceType">Invoice Type</label>
            <div class="form-input-wrap">
              <select class="form-select-control" id="inpInvoiceType">
                <option value="B2B">B2B</option>
                <option value="B2C">B2C</option>
                <option value="Cash">Cash</option>
              </select>
            </div>
          </div>

          <!-- 8. Address -->
          <div class="form-row-group">
            <label class="form-label" for="inpAddress">Address</label>
            <div class="form-input-wrap">
              <input type="text" class="form-input-control" id="inpAddress" placeholder="Enter Company Address">
            </div>
          </div>

          <!-- 9. Status (Real Slide Toggle Switch: Green ON, Red OFF) -->
          <div class="form-row-group">
            <label class="form-label">Status</label>
            <div class="form-input-wrap slider-wrap">
              <label class="toggle-slide-switch">
                <input type="checkbox" id="inpStatusToggle" checked>
                <span class="toggle-slide-slider"></span>
              </label>
              <span class="toggle-status-label" id="lblFormStatus">Active</span>
            </div>
          </div>

        </form>
      </div>

      <!-- Action Buttons Below Card (Checkmark and Save Disk) -->
      <div class="side-form-actions-bottom">
        <!-- Green Approve / Checkmark Button -->
        <button type="button" class="btn-card-submit" id="btnSubmitCustomer" title="Approve & Submit" aria-label="Submit">
          <img src="icons/Approve.svg" alt="Approve" width="36" height="36">
        </button>
        <!-- Green Floppy Disk Save Button -->
        <button type="button" class="btn-card-save" id="btnSaveCustomer" title="Save Record" aria-label="Save">
          <img src="icons/Save.svg" alt="Save" width="36" height="36">
        </button>
      </div>

    </div>
  </div>

  <!-- EXCEL-STYLE FILTER POPUP (Simplified & Clean) -->
  <div class="excel-filter-dropdown" id="excelFilterDropdown" style="display: none;">
    <!-- Live Search Bar with Magnifying Glass Icon -->
    <div class="excel-filter-search-wrap">
      <img src="icons/Search.svg" alt="Search" class="search-lens-img">
      <input type="text" class="excel-filter-search-input" id="filterSearchInput" placeholder="Search...">
    </div>

    <!-- Circular Checkbox Options List Container -->
    <div class="excel-filter-options-box">
      <!-- Select All Checkbox (Circular) -->
      <label class="excel-checkbox-item select-all-item">
        <input type="checkbox" id="chkFilterSelectAll" checked>
        <span class="chk-label"><strong>(Select All)</strong></span>
      </label>

      <!-- Scrollable Distinct Values Checkbox List -->
      <div class="excel-checkbox-scroll-list" id="filterCheckboxList">
        <!-- Injected dynamically by home.js -->
      </div>
    </div>

    <!-- Footer Action Buttons (Tick on Left Corner, Eraser on Right Corner) -->
    <div class="excel-filter-footer">
      <!-- Apply Button with Tick Icon (Left Side Corner) -->
      <button type="button" class="btn-filter-icon btn-filter-apply" id="btnApplyFilter" title="Apply Filter" aria-label="Apply">
        <img src="icons/Approve.svg" alt="Apply" width="22" height="22">
      </button>
      <!-- Cancel Button with Eraser Icon (Right Side Corner) -->
      <button type="button" class="btn-filter-icon btn-filter-cancel" id="btnCancelFilter" title="Cancel" aria-label="Cancel">
        <img src="icons/Erase.svg" alt="Cancel" width="22" height="22">
      </button>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="home-toast" id="homeToast"></div>

  <script src="assets/js/home.js?v=30"></script>
</body>

</html>
